name: Build Android APK

on:
  push:
    branches:
      - build-apk
      - new-client-face-attendance
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set artifact name
        id: artifact
        run: |
          if [ "${{ github.ref_name }}" = "new-client-face-attendance" ]; then
            echo "name=face-attendance-app" >> $GITHUB_OUTPUT
          else
            echo "name=evron-ai-app" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci && npm install @tailwindcss/oxide-linux-x64-gnu

      - name: Build web assets
        env:
          VITE_API_URL: "https://172.16.24.50:5184/api"
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
